<div class="flex flex-col gap-8">
  <div class="flex items-center gap-4">
    <img src="mol-logo.svg" alt="My Office Lunch Logo" width="50" />
    <h1 class="text-5xl inline-block mb-1">My Office Lunch</h1>
  </div>

  <div class="w-[450px]">
    <input nz-input placeholder="Email" [(ngModel)]="email" />

    <nz-input-password>
      <input nz-input placeholder="Password" [(ngModel)]="password" />
    </nz-input-password>

    <button nz-button nzType="primary" (click)="signIn()">Sign In</button>
  </div>
</div>
