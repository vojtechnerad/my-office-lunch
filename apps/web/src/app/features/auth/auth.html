<div class="flex flex-col gap-8">
  <div class="flex items-center gap-4">
    <img src="mol-logo.svg" alt="My Office Lunch Logo" width="50" />
    <h1 class="text-5xl inline-block mb-1">My Office Lunch</h1>
  </div>

  <div class="w-[450px] flex flex-col">
    <input hlmInput placeholder="Email" [(ngModel)]="email" />

    <div class="relative w-full">
      <!-- Vstupní pole, které mění typ na základě Angular signálu -->
      <input
        hlmInput
        [type]="isPasswordVisible() ? 'text' : 'password'"
        id="password-input"
        class="pr-10 w-full"
        placeholder="Zadejte heslo"
        [(ngModel)]="password"
      />

      <button
        hlmBtn
        variant="secondary"
        size="icon"
        class="absolute right-0 top-0 h-full px-3 text-muted-foreground hover:bg-transparent"
        type="button"
        (click)="togglePasswordVisibility()"
      >
        @if (isPasswordVisible()) {
          <ng-icon name="lucideEye" />
        } @else {
          <ng-icon name="lucideEyeOff" />
        }
      </button>
    </div>

    <button hlmBtn (click)="signIn()">Sign In</button>
  </div>
</div>
