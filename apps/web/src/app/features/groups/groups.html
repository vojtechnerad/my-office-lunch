<nz-list nzBordered nzHeader="Header" nzFooter="Footer">
  @for (item of groups(); track item.id) {
  <nz-list-item>
    <!-- <span nz-typography><mark>[ITEM]</mark></span> -->
    <div>
      <div>{{ item.name }}</div>
      <div>{{ item.adminUserId }}</div>
    </div>

    <div>
      <span>Members: TODO</span>
      <a routerLink="/groups/{{ item.id }}">
        <span>→</span>
      </a>
    </div>
  </nz-list-item>
  }
</nz-list>
