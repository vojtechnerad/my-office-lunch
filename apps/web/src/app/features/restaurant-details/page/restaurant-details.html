@if (restaurant()) {
  <div class="flex items-center gap-2">
    @if (restaurant()?.icon) {
      <img [src]="restaurant()?.icon" width="50px" alt="Náhled fotky" />
    }
    <h1 class="text-3xl">{{ restaurant()?.name }}</h1>
  </div>
  <p>{{ restaurant()?.url }}</p>
  <p>{{ restaurant()?.dailyMenuUrl }}</p>
}

<button
  nz-button
  nzType="primary"
  nzDanger
  (click)="handleDeleteRestaurant(restaurant()?.id)"
>
  Delete
</button>
