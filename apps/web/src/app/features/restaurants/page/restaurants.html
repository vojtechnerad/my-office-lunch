<hlm-item-group>
  @for (item of restaurants(); track item.id) {
    <a hlmItem variant="default" routerLink="/restaurants/{{ item.id }}">
      <hlm-item-media>
        <img hlmAvatarImage [src]="item.icon" [alt]="item.name" width="20" />
      </hlm-item-media>

      <hlm-item-content class="gap-1">
        <hlm-item-title>{{ item.name }}</hlm-item-title>
      </hlm-item-content>

      <hlm-item-actions>
        <button hlmBtn variant="ghost" size="icon" class="rounded-full">
          <ng-icon name="lucideChevronRight" />
        </button>
      </hlm-item-actions>
    </a>
  }
</hlm-item-group>
