<button nz-button nzType="primary" (click)="handleClickNewRestaurant()">
  Add new
</button>

<nz-list nzBordered>
  @for (item of restaurants(); track item.id) {
  <nz-list-item>
    <div>
      <div>{{ item.name }}</div>
    </div>

    <div>
      <a routerLink="/restaurants/{{ item.id }}">
        <span>Details →</span>
      </a>
    </div>
  </nz-list-item>
  }
</nz-list>
